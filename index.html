<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Harmonium Pro Mobile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="harmonium-container">
        <!-- Control Dashboard -->
        <header class="dashboard">
            <div class="brand">
                <h1>Harmonium Pro</h1>
                <span class="badge" id="licenseBadge">Free Version</span>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="scaleSelect">Scale (Swar):</label>
                    <select id="scaleSelect">
                        <option value="0">C (Safed 1)</option>
                        <option value="1">C# (Kala 1)</option>
                        <option value="2">D (Safed 2)</option>
                        <option value="3">D# (Kala 2)</option>
                        <option value="4">E (Safed 3)</option>
                        <option value="5">F (Safed 4)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="reedType">Reed Sound:</label>
                    <select id="reedType">
                        <option value="female">Female Reed</option>
                        <option value="male">Male Reed</option>
                        <option value="organ">Full Coupler</option>
                    </select>
                </div>

                <button id="unlockBtn" class="btn-paid">Unlock Paid</button>
            </div>
        </header>

        <!-- Main Harmonium Keyboard -->
        <div class="bellows-wrapper">
            <div class="keyboard" id="keyboard">
                <!-- Keys dynamically generated -->
            </div>
        </div>

        <footer class="footer">
            <p>Mobile: Touch keys to play | Desktop: Use Keyboard Keys (A, S, D, F...)</p>
        </footer>
    </div>

    <!-- Paid Activation Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h2>Unlock Pro Features</h2>
            <p>Paid version includes studio sound quality and recording.</p>
            <input type="text" id="licenseKey" placeholder="Enter Key (Try: PRO123)">
            <div class="modal-actions">
                <button id="activateBtn" class="btn-submit">Activate Pro</button>
                <button id="closeModalBtn" class="btn-cancel">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
